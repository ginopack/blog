title: My Blog
email: your-email@example.com
description: >-
  A blog about the things I'm learning and building.
baseurl: "" # the subpath of your site, e.g. /blog — leave empty if using a *.github.io repo
url: "" # the base hostname & protocol, e.g. https://username.github.io
twitter_username: yourusername
github_username: yourusername

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
